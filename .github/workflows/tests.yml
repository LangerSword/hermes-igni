name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "fastapi>=0.110" "httpx>=0.27"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Self-play
        run: python smoke_test.py
      - name: Plugin load
        run: python smoke_load.py

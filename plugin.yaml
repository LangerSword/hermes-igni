name: igni
label: Igni
kind: standalone
version: 0.3.1
author: Lakshaya Sharma (LangerSword)
homepage: https://github.com/LangerSword/hermes-igni
description: >
  Card games at the sign of fire. Two complete deterministic engines — Gwent-style
  row warfare (weather, spies, horns, scorch, best of three) and an Arena mana
  duel (30 health, taunts, charge, divine shield, spells) — played against a
  rule-based opponent that keeps its hand hidden. Four tools (table_new,
  table_play, table_state, table_rules), a /table slash command, a hermes table
  CLI with an AI-vs-AI demo, a TUI scoreboard widget, and a playable desktop
  page with 256px pixel-art cards backed by /api/plugins/table. No API keys,
  no network, stdlib only.
requires_hermes: ">=0.23.0"
provides_tools:
  - table_new
  - table_play
  - table_state
  - table_rules
